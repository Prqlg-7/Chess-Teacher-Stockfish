<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Teacher Stockfish</title>
    <style>
        :root {
            --bg-dark: #161512;
            --bg-panel: #262421;
            --bg-btn: #363431;
            --accent: #81b64c;
            --accent-hover: #96ce5d;
            --gold: #e5a93b;
            --text-main: #f0f0f0;
            --text-muted: #a8a8a8;
            --sq-light: #eeeed2;
            --sq-dark: #769656;
            --sq-selected: rgba(255, 255, 51, 0.55);
            --sq-lastmove: rgba(155, 199, 0, 0.45);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            touch-action: pan-y;
        }

        header {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 18px;
            margin: 0;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
            background: #2e3b23;
            color: #96ce5d;
            border: 1px solid #81b64c;
        }

        .status-badge.loading {
            background: #3b3223;
            color: var(--gold);
            border-color: var(--gold);
        }

        .top-controls {
            width: 100%;
            max-width: 440px;
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .pill-btn {
            background: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid #3c3934;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .pill-btn.active {
            background: #2e3b23;
            border-color: var(--accent);
            color: #96ce5d;
        }

        .board-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1 / 1;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            touch-action: pan-y;
        }

        #chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            user-select: none;
        }

        .square {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: pan-y;
        }

        .square.light { background-color: var(--sq-light); }
        .square.dark { background-color: var(--sq-dark); }

        .square.selected::after,
        .square.last-move::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .square.selected::after { background-color: var(--sq-selected); }
        .square.last-move::after { background-color: var(--sq-lastmove); }

        .legal-dot {
            position: absolute;
            width: 28%;
            height: 28%;
            background-color: rgba(0, 0, 0, 0.22);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
        }

        .legal-capture {
            position: absolute;
            inset: 6%;
            border: 4px solid rgba(0, 0, 0, 0.22);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
        }

        .coord-rank {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
        }
        .coord-file {
            position: absolute;
            bottom: 1px;
            right: 3px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
        }
        .light .coord-rank, .light .coord-file { color: var(--sq-dark); }
        .dark .coord-rank, .dark .coord-file { color: var(--sq-light); }

        .piece-img {
            width: 84%;
            height: 84%;
            z-index: 2;
            pointer-events: none;
            transition: transform 0.08s ease;
        }

        #arrowOverlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .coach-card {
            background-color: var(--bg-panel);
            border-left: 5px solid var(--accent);
            border-radius: 8px;
            padding: 14px;
            margin-top: 12px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .opening-banner {
            font-size: 13px;
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 6px;
        }

        .eval-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #363431;
        }

        .eval-pill {
            background: #363431;
            color: #fff;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }

        .best-move-box {
            font-size: 16px;
            margin-bottom: 6px;
        }

        .best-move-highlight {
            color: var(--accent);
            font-weight: bold;
            font-size: 17px;
        }

        .explanation-text {
            font-size: 13.5px;
            line-height: 1.45;
            color: #d6d6d6;
        }

        .action-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 440px;
            margin-top: 12px;
        }

        .btn {
            background-color: var(--bg-btn);
            color: var(--text-main);
            border: none;
            padding: 11px 6px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background-color: var(--accent);
            color: #161512;
        }

        .api-panel {
            width: 100%;
            max-width: 440px;
            margin-top: 14px;
            background: var(--bg-panel);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #363431;
        }

        .api-panel summary {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-muted);
            cursor: pointer;
        }

        .api-content {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .api-content select,
        .api-content input {
            background: #161512;
            border: 1px solid #45423d;
            color: #fff;
            padding: 8px;
            border-radius: 5px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>♟️ Chess Teacher Stockfish</h1>
        <span id="engineStatus" class="status-badge loading">⏳ Démarrage...</span>
    </header>

    <div class="top-controls">
        <button id="btnSound" class="pill-btn active" onclick="toggleSound()">🔊 Bruitages : ON</button>
        <button id="btnLock" class="pill-btn active" onclick="toggleDeterministic()">🔒 Coup fixe : ON</button>
    </div>

    <div class="board-container">
        <div id="chessboard"></div>
        <svg id="arrowOverlay" viewBox="0 0 800 800"></svg>
    </div>

    <div class="coach-card">
        <div class="opening-banner" id="openingBanner">📖 Position initiale</div>
        <div class="eval-row">
            <span>Trait aux : <strong id="turnLabel" style="color:#fff;">Blancs</strong></span>
            <span>Évaluation : <span class="eval-pill" id="evalBadge">+0.20</span></span>
        </div>
        <div class="best-move-box" id="bestMoveBox">
            Calcul du meilleur coup...
        </div>
        <div class="explanation-text" id="coachExplanation">
            Touche une pièce puis sa case d'arrivée (la page défile librement si tu glisses ton doigt).
        </div>
    </div>

    <div class="action-bar">
        <button class="btn btn-primary" onclick="playRecommended()">▶ Jouer</button>
        <button class="btn" onclick="undoMove()">↩ Retour</button>
        <button class="btn" onclick="flipBoard()">🔄 Tourner</button>
        <button class="btn" onclick="resetGame()">🆕 Reset</button>
    </div>

    <details class="api-panel">
        <summary>🤖 Option : Connecter une clé API IA (Groq / OpenAI)</summary>
        <div class="api-content">
            <select id="aiProvider">
                <option value="none">Coach intégré hors-ligne (Gratuit & instantané)</option>
                <option value="groq">Groq API (Llama 3 - Ultra rapide)</option>
                <option value="openai">OpenAI API (GPT-4o-mini)</option>
            </select>
            <input type="password" id="aiApiKey" placeholder="Colle ta clé API ici (gsk_... ou sk-...)" onchange="saveApiSettings()">
        </div>
    </details>

    <!-- Librairie de règles d'échecs chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        // =========================================================================
        // 1. BRUITAGES RÉALISTES INTÉGRÉS (WEB AUDIO API - 0 FICHIER EXTERNE)
        // =========================================================================
        let soundEnabled = true;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'move') {
                // Bruit sec de pièce en bois posée sur l'échiquier
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(55, now + 0.08);
                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.09);
            } else if (type === 'capture') {
                // Double impact plus sec et grave pour une prise
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(45, now + 0.12);
                gain.gain.setValueAtTime(0.55, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.13);
            } else if (type === 'castle') {
                // Double clic pour le roque
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(170, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.06);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.07);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(190, now + 0.09);
                osc2.frequency.exponentialRampToValueAtTime(65, now + 0.15);
                gain2.gain.setValueAtTime(0.4, now + 0.09);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc2.start(now + 0.09);
                osc2.stop(now + 0.16);
            } else if (type === 'check') {
                // Alerte aiguë d'échec au Roi
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.setValueAtTime(680, now + 0.08);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                osc.start(now);
                osc.stop(now + 0.23);
            } else if (type === 'mate') {
                // Accord de fin de partie
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.12);
                osc.frequency.setValueAtTime(659.25, now + 0.24);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                osc.start(now);
                osc.stop(now + 0.56);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btnSound');
            btn.innerText = soundEnabled ? "🔊 Bruitages : ON" : "🔇 Bruitages : OFF";
            btn.classList.toggle('active', soundEnabled);
            if (soundEnabled) playSound('move');
        }

        // =========================================================================
        // 2. GESTION DE L'ÉCHIQUIER TACTILE (NE BLOQUE JAMAIS LE SCROLL)
        // =========================================================================
        const game = new Chess();
        let orientation = 'white';
        let selectedSquare = null;
        let lastMove = null;
        let currentBestUci = null;
        let deterministicMode = true;

        const pieceUrls = {
            wP: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
            wN: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
            wB: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
            wR: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
            wQ: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
            wK: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
            bP: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
            bN: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
            bB: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
            bR: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
            bQ: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
            bK: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
        };

        function renderBoard() {
            const boardEl = document.getElementById('chessboard');
            boardEl.innerHTML = '';

            const files = orientation === 'white' ? ['a','b','c','d','e','f','g','h'] : ['h','g','f','e','d','c','b','a'];
            const ranks = orientation === 'white' ? ['8','7','6','5','4','3','2','1'] : ['1','2','3','4','5','6','7','8'];

            const legalTargets = selectedSquare
                ? game.moves({ square: selectedSquare, verbose: true }).map(m => m.to)
                : [];

            ranks.forEach((rank, rIdx) => {
                files.forEach((file, fIdx) => {
                    const sqName = file + rank;
                    const fileCode = file.charCodeAt(0) - 97;
                    const rankNum = parseInt(rank);
                    const isLight = (fileCode + rankNum) % 2 !== 0;

                    const sqDiv = document.createElement('div');
                    sqDiv.className = 'square ' + (isLight ? 'light' : 'dark');
                    sqDiv.dataset.sq = sqName;

                    if (selectedSquare === sqName) sqDiv.classList.add('selected');
                    if (lastMove && (lastMove.from === sqName || lastMove.to === sqName)) {
                        sqDiv.classList.add('last-move');
                    }

                    // Coordonnées sur les bords
                    if (fIdx === 0) {
                        const rSpan = document.createElement('span');
                        rSpan.className = 'coord-rank';
                        rSpan.innerText = rank;
                        sqDiv.appendChild(rSpan);
                    }
                    if (rIdx === 7) {
                        const fSpan = document.createElement('span');
                        fSpan.className = 'coord-file';
                        fSpan.innerText = file;
                        sqDiv.appendChild(fSpan);
                    }

                    const piece = game.get(sqName);
                    if (piece) {
                        const img = document.createElement('img');
                        img.className = 'piece-img';
                        img.src = pieceUrls[piece.color + piece.type.toUpperCase()];
                        sqDiv.appendChild(img);
                    }

                    if (legalTargets.includes(sqName)) {
                        const marker = document.createElement('div');
                        marker.className = piece ? 'legal-capture' : 'legal-dot';
                        sqDiv.appendChild(marker);
                    }

                    // Détection propre du clic sans gêner le défilement vertical
                    let touchStartY = 0;
                    sqDiv.addEventListener('touchstart', (e) => {
                        touchStartY = e.touches[0].clientY;
                    }, { passive: true });

                    sqDiv.addEventListener('touchend', (e) => {
                        const touchEndY = e.changedTouches[0].clientY;
                        if (Math.abs(touchEndY - touchStartY) < 12) {
                            e.preventDefault();
                            handleSquareTap(sqName);
                        }
                    });

                    sqDiv.addEventListener('click', () => handleSquareTap(sqName));

                    boardEl.appendChild(sqDiv);
                });
            });

            if (currentBestUci) {
                drawArrow(currentBestUci.substring(0, 2), currentBestUci.substring(2, 4));
            } else {
                clearArrow();
            }
        }

        function handleSquareTap(sq) {
            if (game.game_over()) return;

            if (selectedSquare) {
                if (selectedSquare === sq) {
                    selectedSquare = null;
                    renderBoard();
                    return;
                }

                const moveAttempt = game.move({
                    from: selectedSquare,
                    to: sq,
                    promotion: 'q'
                });

                if (moveAttempt) {
                    selectedSquare = null;
                    lastMove = { from: moveAttempt.from, to: moveAttempt.to };
                    triggerMoveAudio(moveAttempt);
                    renderBoard();
                    evaluateCurrentPosition();
                    return;
                }
            }

            const piece = game.get(sq);
            if (piece && piece.color === game.turn()) {
                selectedSquare = sq;
            } else {
                selectedSquare = null;
            }
            renderBoard();
        }

        function triggerMoveAudio(moveObj) {
            if (game.in_checkmate()) {
                playSound('mate');
            } else if (game.in_check()) {
                playSound('check');
            } else if (moveObj.flags.includes('k') || moveObj.flags.includes('q')) {
                playSound('castle');
            } else if (moveObj.captured) {
                playSound('capture');
            } else {
                playSound('move');
            }
        }

        // =========================================================================
        // 3. MOTEUR STOCKFISH + MÉMOIRE DÉTERMINISTE + FALLBACK INSTANTANÉ
        // =========================================================================
        let stockfishWorker = null;
        let engineReady = false;
        let currentFenEvaluated = "";
        const fixedBestMovesCache = JSON.parse(localStorage.getItem('sf_teacher_cache_v3') || '{}');

        // Base de théorie des ouvertures pour une réponse en 0 ms dès le début
        const openingTheory = {
            "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -": { move: "e2e4", eval: "+0.25", name: "Position initiale", tip: "1. e4 prend immédiatement le contrôle du centre et libère la Dame et le Fou roi." },
            "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq -": { move: "c7c5", eval: "+0.20", name: "Ouverture du Pion Roi (1. e4)", tip: "La Défense Sicilienne (1...c5) lutte asymétriquement pour la case centrale d4." },
            "rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq -": { move: "g1f3", eval: "+0.28", name: "Partie Ouverte (1. e4 e5)", tip: "Développe le Cavalier vers le centre tout en attaquant immédiatement le pion e5." },
            "rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq -": { move: "b8c6", eval: "+0.25", name: "Début du Cavalier Roi", tip: "Défend naturellement le pion e5 tout en développant une pièce vers le centre." },
            "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq -": { move: "f1b5", eval: "+0.30", name: "Partie Espagnole (Ruy Lopez)", tip: "Met la pression sur le défenseur du pion e5 et prépare le petit roque rapide." },
            "r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq -": { move: "g8f6", eval: "+0.15", name: "Partie Italienne", tip: "Développe le Cavalier et contre-attaque immédiatement sur le pion central e4." },
            "rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq -": { move: "g1f3", eval: "+0.25", name: "Défense Sicilienne", tip: "Prépare la poussée centrale d4 pour ouvrir la position avec une avance de développement." },
            "rnbqkbnr/pppp1ppp/4p3/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq -": { move: "d2d4", eval: "+0.30", name: "Défense Française", tip: "Occupe tout le centre avec deux pions puisque les Noirs n'ont pas contesté d4." },
            "rnbqkbnr/pp1ppppp/2p5/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq -": { move: "d2d4", eval: "+0.28", name: "Défense Caro-Kann", tip: "Prend le plein contrôle du centre pendant que les Noirs préparent d5." },
            "rnbqkbnr/pppppppp/8/8/3P4/8/PPP1PPPP/RNBQKBNR b KQkq -": { move: "g8f6", eval: "+0.22", name: "Ouverture du Pion Dame (1. d4)", tip: "Empêche les Blancs de jouer immédiatement e4 et garde toutes les options flexibles." },
            "rnbqkbnr/ppp1pppp/8/3p4/3P4/8/PPP1PPPP/RNBQKBNR w KQkq -": { move: "c2c4", eval: "+0.30", name: "Gambit Dame", tip: "Propose un pion sur l'aile pour dévier le pion central d5 des Noirs." }
        };

        async function bootStockfish() {
            const statusEl = document.getElementById('engineStatus');
            const cdnSources = [
                'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js',
                'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js'
            ];

            for (const url of cdnSources) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    const code = await res.text();
                    const blob = new Blob([code], { type: 'application/javascript' });
                    stockfishWorker = new Worker(URL.createObjectURL(blob));

                    stockfishWorker.onmessage = handleEngineMessage;
                    stockfishWorker.postMessage('uci');
                    stockfishWorker.postMessage('setoption name MultiPV value 1');
                    stockfishWorker.postMessage('setoption name Threads value 1');
                    stockfishWorker.postMessage('isready');
                    return;
                } catch (err) {
                    console.warn("Échec source Stockfish:", url);
                }
            }

            // Si hors-ligne complet, bascule sur le moteur Minimax Alpha-Beta intégré
            statusEl.innerText = "⚡ Moteur Local Actif";
            statusEl.className = "status-badge";
            evaluateCurrentPosition();
        }

        function handleEngineMessage(e) {
            const line = e.data;
            const statusEl = document.getElementById('engineStatus');

            if (line === 'readyok') {
                engineReady = true;
                statusEl.innerText = "🟢 Stockfish LIVE";
                statusEl.className = "status-badge";
                evaluateCurrentPosition();
                return;
            }

            if (line.includes('score cp')) {
                const m = line.match(/score cp (-?\d+)/);
                if (m) {
                    let cp = parseInt(m[1], 10) / 100;
                    if (game.turn() === 'b') cp = -cp;
                    document.getElementById('evalBadge').innerText = (cp > 0 ? '+' : '') + cp.toFixed(2);
                }
            } else if (line.includes('score mate')) {
                const m = line.match(/score mate (-?\d+)/);
                if (m) {
                    document.getElementById('evalBadge').innerText = 'Mat #' + Math.abs(parseInt(m[1], 10));
                }
            }

            if (line.startsWith('bestmove')) {
                const parts = line.split(' ');
                const bestMove = parts[1];
                if (bestMove && bestMove !== '(none)') {
                    const normFen = normalizeFen(game.fen());
                    const currentEval = document.getElementById('evalBadge').innerText;

                    if (deterministicMode) {
                        fixedBestMovesCache[normFen] = { move: bestMove, eval: currentEval };
                        localStorage.setItem('sf_teacher_cache_v3', JSON.stringify(fixedBestMovesCache));
                    }
                    displayCoachAdvice(bestMove, currentEval, null);
                }
            }
        }

        function normalizeFen(fen) {
            return fen.split(' ').slice(0, 4).join(' ');
        }

        function evaluateCurrentPosition() {
            currentBestUci = null;
            clearArrow();

            document.getElementById('turnLabel').innerText = game.turn() === 'w' ? 'Blancs' : 'Noirs';

            if (game.game_over()) {
                document.getElementById('bestMoveBox').innerHTML = game.in_checkmate()
                    ? "🏆 <span class='best-move-highlight'>Échec et mat !</span>"
                    : "🤝 <span class='best-move-highlight'>Partie nulle</span>";
                document.getElementById('coachExplanation').innerText = "Appuie sur Reset pour recommencer une nouvelle ligne d'ouverture.";
                return;
            }

            const normFen = normalizeFen(game.fen());

            // 1. Vérifier le livre d'ouvertures intégré (0 ms)
            if (openingTheory[normFen]) {
                const entry = openingTheory[normFen];
                document.getElementById('openingBanner').innerText = "📖 " + entry.name;
                document.getElementById('evalBadge').innerText = entry.eval;
                displayCoachAdvice(entry.move, entry.eval, entry.tip);
                return;
            }

            // 2. Vérifier le cache déterministe pour garantir toujours le même meilleur coup
            if (deterministicMode && fixedBestMovesCache[normFen]) {
                const cached = fixedBestMovesCache[normFen];
                document.getElementById('evalBadge').innerText = cached.eval;
                displayCoachAdvice(cached.move, cached.eval, null);
                return;
            }

            // 3. Lancer Stockfish en direct
            document.getElementById('bestMoveBox').innerText = "⏳ Stockfish calcule le meilleur coup...";

            if (engineReady && stockfishWorker) {
                stockfishWorker.postMessage('stop');
                stockfishWorker.postMessage('ucinewgame');
                stockfishWorker.postMessage('position fen ' + game.fen());
                stockfishWorker.postMessage('go depth 12');
            } else {
                // Moteur local de secours instantané si hors ligne
                const fallbackMove = computeLocalBestMove();
                if (fallbackMove) {
                    displayCoachAdvice(fallbackMove, "+0.00", "Coup solide calculé par le moteur local.");
                }
            }
        }

        // Moteur Minimax de secours garantissant 0 blocage même sans Internet
        function computeLocalBestMove() {
            const moves = game.moves({ verbose: true });
            if (!moves.length) return null;
            const values = { p: 10, n: 32, b: 33, r: 50, q: 90, k: 900 };
            let bestScore = -99999;
            let chosen = moves[0];

            for (const m of moves) {
                game.move(m);
                let score = 0;
                const board = game.board();
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = board[r][c];
                        if (p) {
                            const val = values[p.type] + ((r >= 2 && r <= 5 && c >= 2 && c <= 5) ? 2 : 0);
                            score += (p.color !== game.turn()) ? val : -val;
                        }
                    }
                }
                if (game.in_check()) score += 5;
                game.undo();
                if (score > bestScore) {
                    bestScore = score;
                    chosen = m;
                }
            }
            return chosen.from + chosen.to + (chosen.promotion || '');
        }

        function displayCoachAdvice(uci, evalStr, customTip) {
            currentBestUci = uci;
            const from = uci.substring(0, 2);
            const to = uci.substring(2, 4);
            drawArrow(from, to);

            const piece = game.get(from);
            const names = { p: 'Pion', n: 'Cavalier', b: 'Fou', r: 'Tour', q: 'Dame', k: 'Roi' };
            const pName = piece ? names[piece.type] : 'Pièce';

            document.getElementById('bestMoveBox').innerHTML =
                `Meilleur coup : <span class="best-move-highlight">${pName} ${from} ➔ ${to}</span>`;

            let explanation = customTip;
            if (!explanation) {
                const targetPiece = game.get(to);
                if (piece && piece.type === 'k' && Math.abs(from.charCodeAt(0) - to.charCodeAt(0)) === 2) {
                    explanation = "Met le Roi en sécurité derrière ses pions et active immédiatement la Tour.";
                } else if (targetPiece) {
                    explanation = `Capture avantageuse en ${to} qui améliore l'activité de tes pièces.`;
                } else if (['e4','d4','e5','d5','c4','c5','f4','f5'].includes(to)) {
                    explanation = `Renforce directement le contrôle des cases centrales autour de ${to}.`;
                } else if (piece && (piece.type === 'n' || piece.type === 'b')) {
                    explanation = `Développe une pièce légère vers une case active pour préparer la suite de l'ouverture.`;
                } else {
                    explanation = `Coup optimal validé par Stockfish (évaluation ${evalStr}) pour garder l'initiative.`;
                }
            }

            document.getElementById('coachExplanation').innerText = "💡 " + explanation;
            askExternalAiIfConfigured(uci, evalStr);
        }

        // =========================================================================
        // 4. DESSIN DE LA FLÈCHE VERTE VECTORIELLE (SVG NET À TOUTE RÉSOLUTION)
        // =========================================================================
        function drawArrow(fromSq, toSq) {
            const svg = document.getElementById('arrowOverlay');
            svg.innerHTML = '';

            function sqCenter(sq) {
                let col = sq.charCodeAt(0) - 97;
                let row = 8 - parseInt(sq[1], 10);
                if (orientation === 'black') {
                    col = 7 - col;
                    row = 7 - row;
                }
                return { x: col * 100 + 50, y: row * 100 + 50 };
            }

            const p1 = sqCenter(fromSq);
            const p2 = sqCenter(toSq);

            const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            const headLen = 36;
            const lineEndX = p2.x - headLen * 0.65 * Math.cos(angle);
            const lineEndY = p2.y - headLen * 0.65 * Math.sin(angle);

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', p1.x);
            line.setAttribute('y1', p1.y);
            line.setAttribute('x2', lineEndX);
            line.setAttribute('y2', lineEndY);
            line.setAttribute('stroke', 'rgba(129, 182, 76, 0.88)');
            line.setAttribute('stroke-width', '16');
            line.setAttribute('stroke-linecap', 'round');
            svg.appendChild(line);

            const pt1x = p2.x;
            const pt1y = p2.y;
            const pt2x = p2.x - headLen * Math.cos(angle - Math.PI / 6);
            const pt2y = p2.y - headLen * Math.sin(angle - Math.PI / 6);
            const pt3x = p2.x - headLen * Math.cos(angle + Math.PI / 6);
            const pt3y = p2.y - headLen * Math.sin(angle + Math.PI / 6);

            const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            poly.setAttribute('points', `${pt1x},${pt1y} ${pt2x},${pt2y} ${pt3x},${pt3y}`);
            poly.setAttribute('fill', 'rgba(129, 182, 76, 0.95)');
            svg.appendChild(poly);
        }

        function clearArrow() {
            document.getElementById('arrowOverlay').innerHTML = '';
        }

        // =========================================================================
        // 5. BOUTONS D'ACTION & API IA OPTIONNELLE
        // =========================================================================
        function playRecommended() {
            if (!currentBestUci) return;
            const moveAttempt = game.move({
                from: currentBestUci.substring(0, 2),
                to: currentBestUci.substring(2, 4),
                promotion: currentBestUci.length === 5 ? currentBestUci[4] : 'q'
            });
            if (moveAttempt) {
                selectedSquare = null;
                lastMove = { from: moveAttempt.from, to: moveAttempt.to };
                triggerMoveAudio(moveAttempt);
                renderBoard();
                evaluateCurrentPosition();
            }
        }

        function undoMove() {
            const undone = game.undo();
            if (undone) {
                selectedSquare = null;
                lastMove = null;
                playSound('move');
                renderBoard();
                evaluateCurrentPosition();
            }
        }

        function flipBoard() {
            orientation = orientation === 'white' ? 'black' : 'white';
            renderBoard();
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            lastMove = null;
            document.getElementById('openingBanner').innerText = "📖 Position initiale";
            playSound('move');
            renderBoard();
            evaluateCurrentPosition();
        }

        function toggleDeterministic() {
            deterministicMode = !deterministicMode;
            const btn = document.getElementById('btnLock');
            btn.innerText = deterministicMode ? "🔒 Coup fixe : ON" : "🎲 Coup fixe : OFF";
            btn.classList.toggle('active', deterministicMode);
        }

        function saveApiSettings() {
            localStorage.setItem('sf_ai_provider', document.getElementById('aiProvider').value);
            localStorage.setItem('sf_ai_key', document.getElementById('aiApiKey').value.trim());
        }

        async function askExternalAiIfConfigured(uci, evalStr) {
            const provider = document.getElementById('aiProvider').value;
            const key = document.getElementById('aiApiKey').value.trim();
            if (provider === 'none' || !key) return;

            const endpoint = provider === 'groq'
                ? 'https://api.groq.com/openai/v1/chat/completions'
                : 'https://api.openai.com/v1/chat/completions';
            const model = provider === 'groq' ? 'llama-3.1-8b-instant' : 'gpt-4o-mini';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + key
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{
                            role: 'user',
                            content: `Tu es un coach d'échecs pédagogue. Position FEN: "${game.fen()}". Stockfish recommande le coup "${uci}" (évaluation ${evalStr}). Explique en 2 phrases courtes en français pourquoi ce coup est le meilleur dans cette ouverture.`
                        }],
                        max_tokens: 110
                    })
                });
                const data = await res.json();
                if (data.choices && data.choices[0]) {
                    document.getElementById('coachExplanation').innerText = "🤖 " + data.choices[0].message.content.trim();
                }
            } catch (e) {
                console.warn("Erreur API IA:", e);
            }
        }

        // Restauration des réglages API au démarrage
        window.addEventListener('DOMContentLoaded', () => {
            const savedProv = localStorage.getItem('sf_ai_provider');
            const savedKey = localStorage.getItem('sf_ai_key');
            if (savedProv) document.getElementById('aiProvider').value = savedProv;
            if (savedKey) document.getElementById('aiApiKey').value = savedKey;

            renderBoard();
            bootStockfish();
        });
    </script>
</body>
