<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Teacher - Coach d'Ouvertures</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #161512;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Écran d'accueil */
        #welcomeScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .logo-icon {
            font-size: 64px;
            margin-bottom: 12px;
        }
        #welcomeScreen h1 {
            font-size: 28px;
            color: #81b64c;
            margin: 0 0 12px 0;
        }
        #welcomeScreen p {
            color: #bababa;
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 32px 0;
        }
        .start-main-btn {
            background: linear-gradient(135deg, #81b64c, #689f38);
            color: #161512;
            border: none;
            padding: 18px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(129, 182, 76, 0.35);
            transition: transform 0.15s;
            width: 100%;
            max-width: 360px;
        }
        .start-main-btn:active {
            transform: scale(0.97);
        }

        /* Écran d'entraînement */
        #appScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
            padding: 12px 15px 30px 15px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }
        .top-bar h2 {
            font-size: 17px;
            color: #81b64c;
            margin: 0;
        }
        .top-actions {
            display: flex;
            gap: 6px;
        }
        .mini-btn {
            background-color: #2b2926;
            color: #e0e0e0;
            border: 1px solid #3e3b37;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .phase-banner {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        .phase-demo {
            background-color: #1e3a5f;
            color: #90caf9;
            border: 1px solid #2b548a;
        }
        .phase-test {
            background-color: #2e4a1e;
            color: #c5e1a5;
            border: 1px solid #4c7a32;
        }
        .phase-done {
            background-color: #4a3b14;
            color: #ffe082;
            border: 1px solid #8c6d1f;
        }

        /* Échiquier et flèches */
        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            touch-action: pan-y; /* Permet le défilement vertical fluide sur mobile */
        }
        #myBoard {
            width: 100%;
        }
        #arrowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .highlight-sq {
            box-shadow: inset 0 0 3px 3px rgba(255, 235, 59, 0.85);
        }

        /* Panneau d'explications */
        .coach-box {
            background-color: #262421;
            border-left: 5px solid #81b64c;
            border-radius: 8px;
            padding: 14px;
            margin-top: 12px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .opening-title {
            font-size: 14px;
            color: #e5a93b;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .coach-advice {
            font-size: 15px;
            line-height: 1.45;
            color: #f0f0f0;
        }
        .move-badge {
            display: inline-block;
            background-color: #363431;
            color: #81b64c;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 15px;
        }

        /* Contrôles */
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            width: 100%;
            flex-wrap: wrap;
        }
        .ctrl-btn {
            background-color: #363431;
            color: #ffffff;
            border: none;
            padding: 12px 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            min-width: 100px;
            text-align: center;
        }
        .ctrl-btn:active {
            transform: scale(0.98);
        }
        .btn-hint {
            background-color: #2196f3;
            color: #ffffff;
        }
        .btn-next {
            background-color: #81b64c;
            color: #161512;
        }
        .btn-skip {
            background-color: #e5a93b;
            color: #161512;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN D'ACCUEIL -->
    <div id="welcomeScreen">
        <div class="logo-icon">♟️</div>
        <h1>Chess Teacher</h1>
        <p>Mémorise les meilleures variantes d'ouvertures coup par coup, comprends la stratégie derrière chaque mouvement et teste ta mémoire face à l'adversaire.</p>
        <button class="start-main-btn" onclick="demarrerApplication()">Commencer à apprendre les ouvertures d'échecs</button>
    </div>

    <!-- ÉCRAN D'ENTRAÎNEMENT -->
    <div id="appScreen">
        <div class="top-bar">
            <h2>♟️ Chess Teacher</h2>
            <div class="top-actions">
                <button class="mini-btn" id="btnMode" onclick="basculerModeSaisie()">👆 Toucher</button>
                <button class="mini-btn" id="btnSound" onclick="basculerSon()">🔊 Son</button>
            </div>
        </div>

        <div id="phaseBanner" class="phase-banner phase-demo">
            Phase 1 : Observe et mémorise la séquence
        </div>

        <div class="board-wrapper">
            <div id="myBoard"></div>
            <canvas id="arrowCanvas"></canvas>
        </div>

        <div class="coach-box" id="coachBox">
            <div class="opening-title">
                <span id="openingName">Ouverture</span>
                <span id="stepCounter">Coup 1</span>
            </div>
            <div class="coach-advice" id="coachText">
                Préparation de la variante...
            </div>
        </div>

        <div class="controls" id="controlsArea">
            <button class="ctrl-btn btn-skip" id="btnSkipDemo" onclick="passerAuTest()">⚡ Passer au test</button>
            <button class="ctrl-btn btn-hint" id="btnHint" onclick="afficherIndice()" style="display:none;">💡 Indice</button>
            <button class="ctrl-btn" onclick="revoirVariante()">🔁 Revoir</button>
            <button class="ctrl-btn btn-next" onclick="nouvelleVarianteAleatoire()">🎲 Autre variante</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        // ==========================================
        // BASE DE DONNÉES DES 6 VARIANTES OFFICIELLES
        // ==========================================
        const VARIANTES = [
            {
                nom: "Variante 1 : Partie Espagnole (Ruy Lopez)",
                coups: [
                    { w: "e4",  wDesc: "Prend immédiatement le contrôle du centre et ouvre des lignes pour la Dame et le Fou.", b: "e5",   bDesc: "Les Noirs bloquent le centre en répondant symétriquement." },
                    { w: "Nf3", wDesc: "Développe le Cavalier vers le centre et attaque directement le pion e5.", b: "Nc6",  bDesc: "Les Noirs défendent leur pion e5 avec leur Cavalier." },
                    { w: "Bb5", wDesc: "La Partie Espagnole : met la pression sur le Cavalier qui défend le pion e5 et prépare le roque.", b: "a6",   bDesc: "Les Noirs attaquent aussitôt ton Fou pour le forcer à décider." },
                    { w: "Ba4", wDesc: "Recule le Fou tout en maintenant la pression sur la diagonale a4-e8 et le Cavalier c6.", b: "Nf6",  bDesc: "Les Noirs développent leur Cavalier et attaquent ton pion e4." },
                    { w: "O-O", wDesc: "Met le Roi en sécurité et active la Tour en f1 sur la colonne centrale.", b: "Be7",  bDesc: "Les Noirs préparent leur propre roque." },
                    { w: "Re1", wDesc: "Protège solidement le pion e4 et menace maintenant de gagner le pion e5.", b: "b5",   bDesc: "Les Noirs chassent ton Fou pour couper la menace sur le Cavalier c6." },
                    { w: "Bb3", wDesc: "Replace le Fou sur la grande diagonale a2-g8 qui vise directement le roque adverse.", b: null,   bDesc: "" }
                ]
            },
            {
                nom: "Variante 2 : Défense Sicilienne (Attaque Anglaise)",
                coups: [
                    { w: "e4",   wDesc: "Prend immédiatement le contrôle du centre et libère la Dame et le Fou.", b: "c5",   bDesc: "Défense Sicilienne : les Noirs luttent de façon asymétrique pour la case d4." },
                    { w: "Nf3",  wDesc: "Développe le Cavalier vers le centre et prépare la poussée d4 pour ouvrir le jeu.", b: "d6",   bDesc: "Les Noirs contrôlent la case e5 et préparent le développement de leur Fou." },
                    { w: "d4",   wDesc: "Ouvre immédiatement le centre et force l'échange d'un pion latéral noir contre un pion central.", b: "cxd4", bDesc: "Les Noirs échangent leur pion latéral contre ton pion central." },
                    { w: "Nxd4", wDesc: "Reprend le pion et installe un Cavalier très actif et centralisé en d4.", b: "Nf6",  bDesc: "Les Noirs développent leur Cavalier et attaquent ton pion e4." },
                    { w: "Nc3",  wDesc: "Développe le deuxième Cavalier vers le centre tout en protégeant solidement le pion e4.", b: "a6",   bDesc: "Variante Najdorf : empêche tes pièces d'aller en b5 et prépare b5." },
                    { w: "Be3",  wDesc: "Développe le Fou sur une excellente diagonale, soutient le Cavalier d4 et prépare le grand roque.", b: null,   bDesc: "" }
                ]
            },
            {
                nom: "Variante 3 : Défense Française (Variante d'Avance)",
                coups: [
                    { w: "e4",  wDesc: "Prend immédiatement le contrôle du centre et libère la Dame et le Fou.", b: "e6",   bDesc: "Défense Française : les Noirs préparent la contre-attaque au centre en d5." },
                    { w: "d4",  wDesc: "Installe un duo de pions idéal au centre (e4 et d4) et contrôle un maximum d'espace.", b: "d5",   bDesc: "Les Noirs attaquent aussitôt ton pion e4." },
                    { w: "e5",  wDesc: "Variante d'Avance : gagne de l'espace au centre, chasse le Cavalier noir de f6 et enferme le Fou adverse.", b: "c5",   bDesc: "Les Noirs attaquent la base de ta chaîne de pions en d4." },
                    { w: "c3",  wDesc: "Renforce solidement le pion d4 pour garder ta chaîne de pions intacte en cas d'échange.", b: "Nc6",  bDesc: "Les Noirs ajoutent une pression supplémentaire sur le pion d4." },
                    { w: "Nf3", wDesc: "Développe le Cavalier vers le centre et ajoute un second défenseur sur le pion d4.", b: "Qb6",  bDesc: "Les Noirs attaquent d4 une troisième fois avec leur Dame." },
                    { w: "Be2", wDesc: "Développe le Fou calmement et prépare le petit roque pour mettre le Roi à l'abri.", b: null,   bDesc: "" }
                ]
            },
            {
                nom: "Variante 4 : Défense Caro-Kann (Classique)",
                coups: [
                    { w: "e4",   wDesc: "Prend immédiatement le contrôle du centre et ouvre des lignes pour la Dame et le Fou.", b: "c6",   bDesc: "Défense Caro-Kann : prépare la poussée d5 soutenue par le pion c6." },
                    { w: "d4",   wDesc: "Installe immédiatement deux pions au centre (e4 et d4) et contrôle un maximum d'espace.", b: "d5",   bDesc: "Les Noirs attaquent aussitôt ton pion e4." },
                    { w: "Nd2",  wDesc: "Protège solidement le pion e4 tout en gardant la possibilité de pousser le pion c3.", b: "dxe4", bDesc: "Les Noirs échangent le pion central." },
                    { w: "Nxe4", wDesc: "Reprend le pion et installe un Cavalier très puissant au centre de l'échiquier.", b: "Bf5",  bDesc: "Les Noirs sortent leur Fou à l'extérieur de leur chaîne de pions." },
                    { w: "Ng3",  wDesc: "Attaque immédiatement le Fou adverse tout en mettant le Cavalier à l'abri, gagnant un temps précieux.", b: "Bg6",  bDesc: "Les Noirs reculent leur Fou attaqué sur sa case de repli naturelle." },
                    { w: "Nf3",  wDesc: "Développe harmonieusement le deuxième Cavalier vers le centre et prépare le petit roque.", b: null,   bDesc: "" }
                ]
            },
            {
                nom: "Variante 5 : Partie Italienne (Attaque Centrale + Bb5)",
                coups: [
                    { w: "e4",   wDesc: "Prend immédiatement le contrôle du centre et ouvre des lignes pour la Dame et le Fou.", b: "e5",   bDesc: "Les Noirs répondent symétriquement au centre." },
                    { w: "Nf3",  wDesc: "Développe le Cavalier vers le centre et attaque le pion e5.", b: "Nc6",  bDesc: "Les Noirs défendent leur pion e5 avec le Cavalier." },
                    { w: "Bc4",  wDesc: "La Partie Italienne : place le Fou sur une diagonale redoutable qui vise le point faible f7.", b: "Bc5",  bDesc: "Les Noirs développent leur Fou sur la même diagonale." },
                    { w: "c3",   wDesc: "Prépare la poussée d4 pour créer un duo de pions idéal au centre.", b: "Nf6",  bDesc: "Les Noirs développent leur Cavalier et attaquent ton pion e4." },
                    { w: "d4",   wDesc: "Attaque immédiatement le centre et le Fou noir en c5, forçant l'échange.", b: "exd4", bDesc: "Les Noirs sont obligés d'échanger le pion central." },
                    { w: "e5",   wDesc: "Contre-attaque le Cavalier noir en f6 avant de reprendre le pion, prenant l'initiative au centre.", b: "d5",   bDesc: "Les Noirs contre-attaquent ton Fou en c4." },
                    { w: "Bb5",  wDesc: "Cloue le Cavalier c6 sur le Roi noir tout en contre-attaquant et en maintenant une forte pression centrale.", b: null,   bDesc: "" }
                ]
            },
            {
                nom: "Variante 6 : Défense Scandinave",
                coups: [
                    { w: "e4",   wDesc: "Prend immédiatement le contrôle du centre et ouvre des lignes pour la Dame et le Fou.", b: "d5",   bDesc: "Défense Scandinave : les Noirs attaquent directement ton pion central." },
                    { w: "exd5", wDesc: "Capture le pion central et force les Noirs à sortir leur Dame très tôt dans la partie.", b: "Qxd5", bDesc: "Les Noirs reprennent le pion avec leur Dame." },
                    { w: "Nc3",  wDesc: "Développe le Cavalier vers le centre tout en attaquant directement la Dame noire, gagnant un temps.", b: "Qa5",  bDesc: "Les Noirs mettent leur Dame à l'abri sur la case principale de la Scandinave." },
                    { w: "d4",   wDesc: "Installe un pion fort au centre, contrôle la case c5 et ouvre la diagonale du Fou de cases noires.", b: "Nf6",  bDesc: "Les Noirs développent leur Cavalier pour lutter pour le centre." },
                    { w: "Nf3",  wDesc: "Développe le deuxième Cavalier vers le centre, contrôle la case clé e5 et prépare la sortie du Fou.", b: "Bf5",  bDesc: "Les Noirs sortent leur Fou de cases blanches à l'extérieur de leur chaîne." },
                    { w: "Bd2",  wDesc: "Développe le Fou tout en découvrant une menace potentielle du Cavalier c3 sur la Dame noire en a5.", b: null,   bDesc: "" }
                ]
            }
        ];

        // ==========================================
        // BRUITAGES INTÉGRÉS (WEB AUDIO API)
        // ==========================================
        let soundEnabled = true;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'move') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(65, now + 0.08);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.09);
            } else if (type === 'capture') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(55, now + 0.12);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.13);
            } else if (type === 'error') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.22);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                osc.start(now);
                osc.stop(now + 0.23);
            } else if (type === 'success') {
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, now + idx * 0.1);
                    g.gain.setValueAtTime(0.25, now + idx * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(now + idx * 0.1);
                    o.stop(now + idx * 0.1 + 0.26);
                });
            }
        }

        function basculerSon() {
            soundEnabled = !soundEnabled;
            document.getElementById("btnSound").innerText = soundEnabled ? "🔊 Son" : "🔇 Muet";
        }

        // ==========================================
        // LOGIQUE D'APPRENTISSAGE EN 2 PHASES
        // ==========================================
        let board = null;
        let game = new Chess();
        let currentVariant = null;
        let lastVariantIndex = -1;
        let mode = 'DEMO'; // 'DEMO' ou 'TEST'
        let currentStepIndex = 0;
        let demoTimer = null;
        let touchMode = true;
        let selectedSquare = null;

        function demarrerApplication() {
            initAudio();
            document.getElementById("welcomeScreen").style.display = "none";
            document.getElementById("appScreen").style.display = "flex";

            creerEchiquier();
            nouvelleVarianteAleatoire();
        }

        function creerEchiquier() {
            if (board) board.destroy();
            board = Chessboard('myBoard', {
                draggable: !touchMode,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: () => board.position(game.fen())
            });

            // Gestion du mode Toucher (clic sur case départ puis case arrivée)
            $('#myBoard').off('click', '.square-55d63').on('click', '.square-55d63', function() {
                if (!touchMode || mode !== 'TEST') return;
                const sq = $(this).attr('data-square');
                gererClicCase(sq);
            });
        }

        function basculerModeSaisie() {
            touchMode = !touchMode;
            selectedSquare = null;
            $('.square-55d63').removeClass('highlight-sq');
            document.getElementById("btnMode").innerText = touchMode ? "👆 Toucher" : "✋ Glisser";
            const currentFen = game.fen();
            creerEchiquier();
            board.position(currentFen, false);
        }

        function nouvelleVarianteAleatoire() {
            clearTimeout(demoTimer);
            let idx;
            do {
                idx = Math.floor(Math.random() * VARIANTES.length);
            } while (idx === lastVariantIndex && VARIANTES.length > 1);
            lastVariantIndex = idx;
            currentVariant = VARIANTES[idx];
            revoirVariante();
        }

        function revoirVariante() {
            clearTimeout(demoTimer);
            mode = 'DEMO';
            currentStepIndex = 0;
            selectedSquare = null;
            $('.square-55d63').removeClass('highlight-sq');
            effacerFleches();

            game.reset();
            board.start(false);

            const banner = document.getElementById("phaseBanner");
            banner.className = "phase-banner phase-demo";
            banner.innerText = "Phase 1 : Observe et mémorise la séquence";

            document.getElementById("openingName").innerText = currentVariant.nom;
            document.getElementById("stepCounter").innerText = "Début";
            document.getElementById("coachText").innerText = "Regarde bien chaque coup des Blancs et son explication...";

            document.getElementById("btnSkipDemo").style.display = "inline-block";
            document.getElementById("btnHint").style.display = "none";

            demoTimer = setTimeout(jouerProchainCoupDemo, 1100);
        }

        function jouerProchainCoupDemo() {
            if (mode !== 'DEMO') return;

            if (currentStepIndex >= currentVariant.coups.length) {
                demoTimer = setTimeout(passerAuTest, 1600);
                return;
            }

            const step = currentVariant.coups[currentStepIndex];

            // Coup des Blancs
            const moveW = game.move(step.w);
            if (moveW) {
                board.position(game.fen());
                playSound(moveW.captured ? 'capture' : 'move');
                dessinerFleche(moveW.from, moveW.to, "rgba(129, 182, 76, 0.88)");

                document.getElementById("stepCounter").innerText = `Coup ${currentStepIndex + 1} / ${currentVariant.coups.length}`;
                document.getElementById("coachText").innerHTML =
                    `Blancs jouent <span class="move-badge">${formatFr(step.w)}</span><br>` +
                    `<span style="font-size:14px; color:#d0d0d0;">💡 ${step.wDesc}</span>`;
            }

            // Si les Noirs ont une réponse dans cette étape
            if (step.b) {
                demoTimer = setTimeout(() => {
                    if (mode !== 'DEMO') return;
                    const moveB = game.move(step.b);
                    if (moveB) {
                        board.position(game.fen());
                        playSound(moveB.captured ? 'capture' : 'move');
                        dessinerFleche(moveB.from, moveB.to, "rgba(229, 169, 59, 0.85)");

                        document.getElementById("coachText").innerHTML =
                            `Noirs répondent <span class="move-badge" style="color:#e5a93b;">${formatFr(step.b)}</span><br>` +
                            `<span style="font-size:14px; color:#d0d0d0;">${step.bDesc}</span>`;
                    }
                    currentStepIndex++;
                    demoTimer = setTimeout(jouerProchainCoupDemo, 2300);
                }, 2300);
            } else {
                currentStepIndex++;
                demoTimer = setTimeout(jouerProchainCoupDemo, 2400);
            }
        }

        function passerAuTest() {
            clearTimeout(demoTimer);
            mode = 'TEST';
            currentStepIndex = 0;
            selectedSquare = null;
            $('.square-55d63').removeClass('highlight-sq');
            effacerFleches();

            game.reset();
            board.start(false);

            const banner = document.getElementById("phaseBanner");
            banner.className = "phase-banner phase-test";
            banner.innerText = "Phase 2 : À toi de jouer de mémoire !";

            document.getElementById("stepCounter").innerText = `Coup 1 / ${currentVariant.coups.length}`;
            document.getElementById("coachText").innerHTML =
                `C'est ton tour avec les <strong>Blancs</strong> ! Joue le 1ᵉʳ coup de la variante (ou clique sur <strong>Indice</strong>).`;

            document.getElementById("btnSkipDemo").style.display = "none";
            document.getElementById("btnHint").style.display = "inline-block";
        }

        // Gestion des coups du joueur en Phase 2 (Toucher ou Glisser)
        function gererClicCase(sq) {
            const piece = game.get(sq);

            if (!selectedSquare) {
                if (piece && piece.color === 'w') {
                    selectedSquare = sq;
                    $('.square-55d63').removeClass('highlight-sq');
                    $(`.square-${sq}`).addClass('highlight-sq');
                }
                return;
            }

            if (selectedSquare === sq) {
                selectedSquare = null;
                $('.square-55d63').removeClass('highlight-sq');
                return;
            }

            if (piece && piece.color === 'w') {
                selectedSquare = sq;
                $('.square-55d63').removeClass('highlight-sq');
                $(`.square-${sq}`).addClass('highlight-sq');
                return;
            }

            const valide = tenterCoupUtilisateur(selectedSquare, sq);
            selectedSquare = null;
            $('.square-55d63').removeClass('highlight-sq');
            if (valide) {
                board.position(game.fen());
            }
        }

        function onDragStart(source, piece) {
            if (touchMode || mode !== 'TEST') return false;
            if (piece.search(/^b/) !== -1) return false;
        }

        function onDrop(source, target) {
            const valide = tenterCoupUtilisateur(source, target);
            if (!valide) return 'snapback';
        }

        function tenterCoupUtilisateur(fromSq, toSq) {
            if (mode !== 'TEST' || currentStepIndex >= currentVariant.coups.length) return false;

            const expectedSan = currentVariant.coups[currentStepIndex].w;
            const moveAttempt = game.move({
                from: fromSq,
                to: toSq,
                promotion: 'q'
            });

            if (moveAttempt === null) return false;

            // Vérification si le coup joué correspond au meilleur coup appris
            if (moveAttempt.san !== expectedSan) {
                game.undo();
                playSound('error');
                document.getElementById("coachText").innerHTML =
                    `❌ Ce n'est pas le coup de cette variante (tu as joué <strong>${formatFr(moveAttempt.san)}</strong>).<br>` +
                    `<span style="font-size:13px; color:#bababa;">Essaie encore ou appuie sur <strong>💡 Indice</strong> !</span>`;
                return false;
            }

            // Coup correct !
            effacerFleches();
            playSound(moveAttempt.captured ? 'capture' : 'move');
            const step = currentVariant.coups[currentStepIndex];

            document.getElementById("coachText").innerHTML =
                `✅ Bravo ! <span class="move-badge">${formatFr(step.w)}</span><br>` +
                `<span style="font-size:14px; color:#d0d0d0;">💡 ${step.wDesc}</span>`;

            // Réponse automatique des Noirs
            if (step.b) {
                setTimeout(() => {
                    const moveB = game.move(step.b);
                    if (moveB) {
                        board.position(game.fen());
                        playSound(moveB.captured ? 'capture' : 'move');
                        dessinerFleche(moveB.from, moveB.to, "rgba(229, 169, 59, 0.85)");

                        currentStepIndex++;
                        document.getElementById("stepCounter").innerText = `Coup ${currentStepIndex + 1} / ${currentVariant.coups.length}`;
                        document.getElementById("coachText").innerHTML =
                            `Noirs répondent <span class="move-badge" style="color:#e5a93b;">${formatFr(step.b)}</span> (${step.bDesc})<br>` +
                            `<strong>À toi de jouer le coup suivant !</strong>`;
                    }
                }, 650);
            } else {
                // Fin de la variante réussie !
                currentStepIndex++;
                setTimeout(() => {
                    playSound('success');
                    const banner = document.getElementById("phaseBanner");
                    banner.className = "phase-banner phase-done";
                    banner.innerText = "🏆 Variante maîtrisée à 100 % !";
                    document.getElementById("btnHint").style.display = "none";
                    document.getElementById("coachText").innerHTML =
                        `🎉 Félicitations ! Tu as retrouvé toute la séquence de la <strong>${currentVariant.nom}</strong>.<br>` +
                        `Clique sur <strong>🎲 Autre variante</strong> pour continuer ton entraînement.`;
                }, 400);
            }

            return true;
        }

        function afficherIndice() {
            if (mode !== 'TEST' || currentStepIndex >= currentVariant.coups.length) return;
            const step = currentVariant.coups[currentStepIndex];

            // Trouver les cases départ/arrivée du coup attendu sans modifier la partie
            const tempGame = new Chess(game.fen());
            const hintMove = tempGame.move(step.w);
            if (hintMove) {
                dessinerFleche(hintMove.from, hintMove.to, "rgba(33, 150, 243, 0.9)");
                document.getElementById("coachText").innerHTML =
                    `💡 <strong>Indice :</strong> Joue <span class="move-badge" style="color:#64b5f6;">${formatFr(step.w)}</span><br>` +
                    `<span style="font-size:14px; color:#d0d0d0;">${step.wDesc}</span>`;
            }
        }

        // Conversion notation anglaise (N, B, R, Q, K) vers française (C, F, T, D, R) pour l'affichage
        function formatFr(san) {
            return san
                .replace(/^N/, 'C')
                .replace(/^B/, 'F')
                .replace(/^R/, 'T')
                .replace(/^Q/, 'D')
                .replace(/^K/, 'R');
        }

        // Dessin des flèches sur le canvas
        function dessinerFleche(fromSq, toSq, color) {
            const canvas = document.getElementById("arrowCanvas");
            const boardEl = document.getElementById("myBoard");
            canvas.width = boardEl.offsetWidth;
            canvas.height = boardEl.offsetHeight;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const sqSize = canvas.width / 8;
            function getCoords(sq) {
                const col = sq.charCodeAt(0) - 97;
                const row = 8 - parseInt(sq);
                return {
                    x: col * sqSize + sqSize / 2,
                    y: row * sqSize + sqSize / 2
                };
            }

            const start = getCoords(fromSq);
            const end = getCoords(toSq);
            const headlen = sqSize * 0.35;
            const angle = Math.atan2(end.y - start.y, end.x - start.x);

            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = sqSize * 0.16;
            ctx.lineCap = "round";

            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x - headlen * 0.6 * Math.cos(angle), end.y - headlen * 0.6 * Math.sin(angle));
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(end.x, end.y);
            ctx.lineTo(end.x - headlen * Math.cos(angle - Math.PI / 6), end.y - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(end.x - headlen * Math.cos(angle + Math.PI / 6), end.y - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }

        function effacerFleches() {
            const canvas = document.getElementById("arrowCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', () => {
            if (board) board.resize();
        });
    </script>
</body>
